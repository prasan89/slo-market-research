[project]
name = "slo-market-research"
version = "0.1.0"
description = "Independent historical research for NIFTY, BANKNIFTY and NSE F&O underlyings"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
